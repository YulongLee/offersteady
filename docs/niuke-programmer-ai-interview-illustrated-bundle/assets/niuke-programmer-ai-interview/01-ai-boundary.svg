<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071713"/><stop offset="1" stop-color="#10251f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#65e6ad"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#ffd479"/></marker><style>.t{font:700 48px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#f4fff9}.s{font:400 24px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#9fc4b5}.h{font:700 29px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#f4fff9}.m{font:400 20px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#9fc4b5}.b{fill:#102a23;stroke:#326453;stroke-width:2;filter:url(#shadow)}.c{fill:#15372e;stroke:#326453;stroke-width:2}.num{font:700 30px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#65e6ad;text-anchor:middle}.center{text-anchor:middle}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="-20" r="310" fill="#164638" opacity=".3"/><circle cx="-60" cy="920" r="330" fill="#0d392e" opacity=".35"/><text x="72" y="95" class="t">程序员技术面试：AI 能帮什么？</text><text x="74" y="140" class="s">把“辅助整理”与“替代能力”分清楚，使用边界才会清晰</text><text x="1500" y="92" class="num">01</text><rect x="70" y="205" width="695" height="585" rx="28" class="b"/><rect x="835" y="205" width="695" height="585" rx="28" class="b"/><text x="110" y="275" class="h" fill="#65e6ad">AI 适合帮助</text><text x="875" y="275" class="h" fill="#ff9d96">AI 无法替代</text><circle cx="121" cy="333" r="11" fill="#65e6ad"/><text x="152" y="340" class="h" font-size="25">整理表达</text><text x="152" y="376" class="m">把零散经验排成清晰的回答结构</text><circle cx="121" cy="417" r="11" fill="#65e6ad"/><text x="152" y="424" class="h" font-size="25">连接上下文</text><text x="152" y="460" class="m">结合简历、JD、资料与前序追问</text><circle cx="121" cy="501" r="11" fill="#65e6ad"/><text x="152" y="508" class="h" font-size="25">补全框架</text><text x="152" y="544" class="m">提醒遗漏的约束、取舍和风险</text><circle cx="121" cy="585" r="11" fill="#65e6ad"/><text x="152" y="592" class="h" font-size="25">理解屏幕</text><text x="152" y="628" class="m">辅助分析代码、SQL、报错与架构图</text><circle cx="121" cy="669" r="11" fill="#65e6ad"/><text x="152" y="676" class="h" font-size="25">面试复盘</text><text x="152" y="712" class="m">定位不会、没讲清和准备不足的问题</text><circle cx="886" cy="333" r="11" fill="#ff9d96"/><text x="917" y="340" class="h" font-size="25">真实经历</text><text x="917" y="376" class="m">没有参与过的项目无法临场补出来</text><circle cx="886" cy="417" r="11" fill="#ff9d96"/><text x="917" y="424" class="h" font-size="25">技术理解</text><text x="917" y="460" class="m">追问“为什么”仍要依靠自己的判断</text><circle cx="886" cy="501" r="11" fill="#ff9d96"/><text x="917" y="508" class="h" font-size="25">代码能力</text><text x="917" y="544" class="m">手写、调试和复杂度分析需要基本功</text><circle cx="886" cy="585" r="11" fill="#ff9d96"/><text x="917" y="592" class="h" font-size="25">临场沟通</text><text x="917" y="628" class="m">倾听、澄清和表达不能交给模型</text><circle cx="886" cy="669" r="11" fill="#ff9d96"/><text x="917" y="676" class="h" font-size="25">事实责任</text><text x="917" y="712" class="m">最终说出口的每个结论由候选人负责</text><text x="800" y="850" class="h center" fill="#b9f8dd" font-size="25">真正的价值：帮助你把自己知道、做过的内容讲清楚</text></svg>