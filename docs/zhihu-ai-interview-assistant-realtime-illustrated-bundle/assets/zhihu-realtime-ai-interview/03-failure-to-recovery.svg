<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071512"/><stop offset="1" stop-color="#10251f"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#6ee7b7"/></marker><style>.title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f3fff9}.sub{font:400 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#9fc2b5}.head{font:700 29px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#effff8}.lab{font:600 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e9fff6;text-anchor:middle}.small{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#b5d5c9;text-anchor:middle}.bad{fill:#3b2425;stroke:#b85f62;stroke-width:2;rx:16}.good{fill:#153b31;stroke:#54d6aa;stroke-width:2;rx:16}.linebad{stroke:#d47779;stroke-width:3;fill:none}.line{stroke:#6ee7b7;stroke-width:3;fill:none;marker-end:url(#a)}.divider{stroke:#31564a;stroke-width:2;stroke-dasharray:10 12}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="82" class="title">两个真实故障，最后都不是模型问题</text>
  <text x="80" y="122" class="sub">高频内存分配导致 Renderer 崩溃；错误补发策略导致 WebSocket 重放风暴</text>
  <line x1="800" y1="165" x2="800" y2="835" class="divider"/>

  <text x="90" y="205" class="head">修复前</text>
  <rect x="95" y="250" width="265" height="105" class="bad"/><text x="227" y="292" class="lab">128 samples</text><text x="227" y="324" class="small">每次新建 Float32Array</text>
  <path d="M360 302 C430 270 465 335 530 302 M360 302 C430 335 465 270 530 302" class="linebad"/>
  <rect x="535" y="250" width="205" height="105" class="bad"/><text x="637" y="292" class="lab">375 次/秒</text><text x="637" y="324" class="small">每声道跨线程传输</text>
  <rect x="95" y="425" width="265" height="105" class="bad"/><text x="227" y="467" class="lab">sequence gap</text><text x="227" y="499" class="small">清空整个 sent 集合</text>
  <path d="M360 478 C430 445 465 510 530 478 M360 478 C430 510 465 445 530 478" class="linebad"/>
  <rect x="535" y="425" width="205" height="105" class="bad"/><text x="637" y="467" class="lab">整队列重放</text><text x="637" y="499" class="small">形成发送风暴</text>
  <rect x="95" y="600" width="645" height="150" class="bad"/><text x="417" y="648" class="lab">真实故障结果</text><text x="417" y="688" class="small">Renderer 黑屏 · 13万～26.6万虚拟内存区域</text><text x="417" y="720" class="small">1634 个唯一帧 → 1253984 次 WebSocket 写入</text>

  <text x="890" y="205" class="head">修复后</text>
  <rect x="895" y="250" width="265" height="105" class="good"/><text x="1027" y="292" class="lab">1024 samples</text><text x="1027" y="324" class="small">固定批次聚合后转移</text>
  <path d="M1160 302 L1240 302" class="line"/>
  <rect x="1245" y="250" width="260" height="105" class="good"/><text x="1375" y="292" class="lab">43～47 次/秒</text><text x="1375" y="324" class="small">传输次数下降 87.5%</text>
  <rect x="895" y="425" width="265" height="105" class="good"/><text x="1027" y="467" class="lab">精确补发</text><text x="1027" y="499" class="small">只补 expected sequence</text>
  <path d="M1160 478 L1240 478" class="line"/>
  <rect x="1245" y="425" width="260" height="105" class="good"/><text x="1375" y="467" class="lab">有界恢复</text><text x="1375" y="499" class="small">8 in-flight · 3 次预算</text>
  <rect x="895" y="600" width="610" height="150" class="good"/><text x="1200" y="648" class="lab">新的可靠性原则</text><text x="1200" y="688" class="small">ACK 推进才代表真实可用</text><text x="1200" y="720" class="small">恢复失败时重建身份，从最新音频继续</text>
</svg>
