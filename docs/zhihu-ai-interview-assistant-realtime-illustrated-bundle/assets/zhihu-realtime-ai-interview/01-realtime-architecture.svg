<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071512"/><stop offset="1" stop-color="#10251f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6ee7b7"/></marker>
    <style>
      .title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f3fff9}.sub{font:400 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#9fc2b5}.box{fill:#132d26;stroke:#2b5f50;stroke-width:2;rx:18;filter:url(#shadow)}.hot{fill:#154536;stroke:#6ee7b7;stroke-width:2.5;rx:18}.label{font:600 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#edfff7;text-anchor:middle}.small{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#acd0c2;text-anchor:middle}.line{stroke:#6ee7b7;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#4c8f79;stroke-width:3;stroke-dasharray:10 10;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="90" r="250" fill="#1c5947" opacity=".18"/><circle cx="160" cy="820" r="300" fill="#0e8060" opacity=".09"/>
  <text x="90" y="88" class="title">实时 AI 面试助手：两条链路，一个会话</text>
  <text x="90" y="128" class="sub">语音链路追求持续、低延迟；截图链路独立处理视觉题目</text>

  <rect x="70" y="205" width="235" height="105" class="box"/><text x="187" y="248" class="label">麦克风</text><text x="187" y="280" class="small">候选人 / microphone</text>
  <rect x="70" y="355" width="235" height="105" class="box"/><text x="187" y="398" class="label">电脑输出</text><text x="187" y="430" class="small">面试官 / system</text>
  <path d="M305 258 C355 258 345 320 395 320" class="line"/><path d="M305 408 C355 408 345 342 395 342" class="line"/>
  <rect x="400" y="260" width="250" height="135" class="hot"/><text x="525" y="310" class="label">Electron</text><text x="525" y="344" class="small">采集、VAD、PCM16</text><text x="525" y="372" class="small">有界队列与恢复</text>
  <path d="M650 328 L735 328" class="line"/>
  <rect x="740" y="260" width="270" height="135" class="box"/><text x="875" y="308" class="label">WebSocket v2</text><text x="875" y="342" class="small">一条连接 / 双逻辑通道</text><text x="875" y="370" class="small">ACK · Resume · 补发</text>
  <path d="M1010 328 L1090 328" class="line"/>
  <rect x="1095" y="205" width="220" height="105" class="box"/><text x="1205" y="248" class="label">Mic ASR</text><text x="1205" y="280" class="small">持久会话</text>
  <rect x="1095" y="355" width="220" height="105" class="box"/><text x="1205" y="398" class="label">System ASR</text><text x="1205" y="430" class="small">持久会话</text>
  <path d="M1010 318 C1050 318 1050 258 1095 258" class="line"/><path d="M1010 338 C1050 338 1050 408 1095 408" class="line"/>
  <path d="M1315 258 C1380 258 1360 340 1415 340" class="line"/><path d="M1315 408 C1380 408 1360 356 1415 356" class="line"/>
  <rect x="1418" y="285" width="135" height="125" class="hot"/><text x="1485" y="330" class="label">Partial</text><text x="1485" y="362" class="small">Final</text><text x="1485" y="390" class="small">Commit</text>

  <path d="M1485 410 L1485 515 L1260 515" class="line"/>
  <rect x="1000" y="470" width="255" height="100" class="box"/><text x="1127" y="512" class="label">Redis Event Stream</text><text x="1127" y="544" class="small">游标、快照、事件</text>
  <path d="M1000 520 L920 520" class="line"/>
  <rect x="720" y="470" width="195" height="100" class="box"/><text x="817" y="512" class="label">Session SSE</text><text x="817" y="544" class="small">实时字幕</text>
  <path d="M720 520 L640 520" class="line"/>
  <rect x="400" y="470" width="235" height="100" class="hot"/><text x="517" y="512" class="label">Web 工作台</text><text x="517" y="544" class="small">电脑 / 手机 / 平板</text>

  <rect x="70" y="675" width="235" height="100" class="box"/><text x="187" y="717" class="label">截屏回答</text><text x="187" y="749" class="small">用户显式触发</text>
  <path d="M305 725 L400 725" class="dash"/>
  <rect x="405" y="675" width="235" height="100" class="box"/><text x="522" y="717" class="label">桌面截图</text><text x="522" y="749" class="small">压缩、上传</text>
  <path d="M640 725 L735 725" class="dash"/>
  <rect x="740" y="675" width="235" height="100" class="box"/><text x="857" y="717" class="label">视觉模型</text><text x="857" y="749" class="small">直接流式回答</text>
  <path d="M975 725 C1110 725 1090 620 1090 570" class="dash"/>
  <text x="1280" y="808" class="sub">OfferSteady / 面试稳 · 工程链路示意</text>
</svg>
