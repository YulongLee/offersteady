onnect Once</text><text x="195.0" y="312" class="m center">session + source</text><rect x="400" y="235" width="245" height="100" rx="20" class="box"/><text x="522.5" y="277" class="h center">Utterance 1</text><text x="522.5" y="312" class="m center">append → commit</text><path d="M320 285 L385 285" stroke="#4ee7ff" stroke-width="4" fill="none" marker-end="url(#cyan)" /><rect x="700" y="235" width="245" height="100" rx="20" class="box"/><text x="822.5" y="277" class="h center">Utterance 2</text><text x="822.5" y="312" class="m center">append → commit</text><path d="M645 285 L685 285" stroke="#4ee7ff" stroke-width="4" fill="none" marker-end="url(#cyan)" /><rect x="1000" y="235" width="245" height="100" rx="20" class="box"/><text x="1122.5" y="277" class="h center">Utterance 3</text><text x="1122.5" y="312" class="m center">append → commit</text><path d="M945 285 L985 285" stroke="#4ee7ff" stroke-width="4" fill="none" marker-end="url(#cyan)" /><rect x="1300" y="235" width="230" height="100" rx="20" class="hot"/><text x="1415.0" y="277" class="h center">Close</text><text x="1415.0" y="312" class="m center">异常 / 会话结束</text><path d="M1245 285 L1285 285" stroke="#4ee7ff" stroke-width="4" fill="none" marker-end="url(#cyan)" /><text x="78" y="430" class="h" fill="#a68cff">单个 utterance 的文本修订</text><rect x="85" y="470" width="110" height="50" rx="14" fill="#a68cff" opacity=".9"/><text x="140" y="503" class="h center" font-size="20">r1</text><rect x="225" y="470" width="565" height="50" rx="14" class="box"/><text x="250" y="503" class="m">请介绍项目</text><rect x="85" y="545" width="110" height="50" rx="14" fill="#a68cff" opacity=".9"/><text x="140" y="578" class="h center" font-size="20">r2</text><rect x="225" y="545" width="565" height="50" rx="14" class="box"/><text x="250" y="578" class="m">请介绍项目的性能优化</text><rect x="85" y="620" width="110" height="50" rx="14" fill="#ff8696" opacity=".9"/><text x="140" y="653" class="h center" font-size="20">r3</text><rect x="225" y="620" width="565" height="50" rx="14" class="box"/><text x="250" y="653" class="m">请介绍项目</text><rect x="85" y="695" width="110" height="50" rx="14" fill="#59e4b0" opacity=".9"/><text x="140" y="728" class="h center" font-size="20">Final</text><rect x="225" y="695" width="565" height="50" rx="14" class="box"/><text x="250" y="728" class="m">请介绍项目的性能优化方案</text><rect x="880" y="455" width="650" height="300" rx="25" class="box"/><text x="920" y="505" class="h" fill="#4ee7ff">前后端稳定归并</text><text x="920" y="558" class="m">① 更短 Partial 不擦除当前更长文本</text><text x="920" y="607" class="m">② 相同或更长 revision 立即更新</text><text x="920" y="656" class="m">③ 迟到 Partial 不覆盖 Final / incomplete</text><text x="920" y="705" class="m">④ 截断式 Final 保留已经展示的完整尾词</text><text x="800" y="835" class="h center" fill="#b9ecff" font-size="23">segmentId + revision + terminal state，缺一项都很难稳定</text><text x="1515" y="865" class="tiny" text-anchor="end">OfferSteady / 面试稳 · 实时 AI 工程复盘</text></svg>