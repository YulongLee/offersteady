<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120c28"/><stop offset="1" stop-color="#071b2c"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-opacity=".3"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#60e4ff"/></marker><style>.t{font:700 46px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#f7f5ff}.s{font:400 23px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#b6afd0}.h{font:700 25px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#f7f5ff}.m{font:400 18px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#b8b2cc}.tiny{font:400 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#9992b3}.box{fill:#18233d;stroke:#3d4e72;stroke-width:2;filter:url(#sh)}.cyan{fill:#12344a;stroke:#60e4ff;stroke-width:2.5}.purple{fill:#2a244d;stroke:#ad91ff;stroke-width:2.5}.red{fill:#40223d;stroke:#ff7f9e;stroke-width:2.5}.center{text-anchor:middle}.n{font:700 29px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#60e4ff;text-anchor:middle}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1470" cy="-50" r="330" fill="#2b245a" opacity=".48"/><circle cx="-100" cy="930" r="350" fill="#0b3b53" opacity=".42"/><text x="72" y="92" class="t">LLM 首 Token = 500ms，用户 500ms 后能看到吗？</text><text x="74" y="138" class="s">不能。模型延迟只是端到端关键路径中的一段</text><text x="1500" y="90" class="n">01</text><rect x="55" y="250" width="215" height="110" rx="20" class="cyan"/><text x="162.5" y="293" class="h center">Audio</text><text x="162.5" y="329" class="m center">采集与分帧</text><path d="M270 305L298 305" stroke="#60e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="310" y="250" width="215" height="110" rx="20" class="box"/><text x="417.5" y="293" class="h center">ASR</text><text x="417.5" y="329" class="m center">Partial / Final</text><path d="M525 305L553 305" stroke="#60e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="565" y="250" width="215" height="110" rx="20" class="box"/><text x="672.5" y="293" class="h center">Endpoint</text><text x="672.5" y="329" class="m center">静音与 Commit</text><path d="M780 305L808 305" stroke="#60e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="820" y="250" width="215" height="110" rx="20" class="box"/><text x="927.5" y="293" class="h center">Context</text><text x="927.5" y="329" class="m center">Retrieval / Rerank</text><path d="M1035 305L1063 305" stroke="#60e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="1075" y="250" width="215" height="110" rx="20" class="purple"/><text x="1182.5" y="293" class="h center">LLM</text><text x="1182.5" y="329" class="m center">First Token</text><path d="M1290 305L1318 305" stroke="#60e4ff" stroke-width="4" marker-end="url(#a)"/><rect x="1330" y="250" width="215" height="110" rx="20" class="cyan"/><text x="1437.5" y="293" class="h center">SSE + UI</text><text x="1437.5" y="329" class="m center">浏览器绘制</text><rect x="130" y="455" width="1340" height="190" rx="28" class="box"/><text x="800" y="510" class="h center" fill="#60e4ff">用户感知延迟</text><text x="800" y="570" class="h center" style="font-size:25px">T_total = T_audio + T_asr + T_endpoint + T_context + T_llm + T_transport + T_render</text><text x="800" y="620" class="m center">优化 LLM 的 300ms，不一定能抵消前面几秒的音频积压或句尾等待</text><rect x="430" y="705" width="740" height="78" rx="20" class="purple"/><text x="800" y="755" class="h center">先找 Critical Path，再决定优化哪一段</text><text x="1510" y="863" class="tiny" text-anchor="end">OfferSteady / 面试稳 · 实时 AI 踩坑复盘</text></svg>