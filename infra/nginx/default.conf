server {
  listen 80;
  server_name _;

  if ($host = www.mianshiwen.cn) {
    return 308 https://mianshiwen.cn$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-h2zt+LUCrVck7i1lC86GgaZqJVSDWqw6mjT5hzjg+i8=' 'sha256-GOcjvQ8AeHKWQCrgFCqG7/EYfPFEbpxYwLX+dFD/3qk=' 'sha256-g61Gx8qh6EeJqNFNPKOopcDVv4mbn7GAWLBVueYCSwA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self' https://pay.mzfpay.com" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    proxy_pass http://backend:8000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /robots.txt {
    types { text/plain txt; }
    try_files $uri =404;
  }

  location = /sitemap.xml {
    types { application/xml xml; }
    try_files $uri =404;
  }

  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-h2zt+LUCrVck7i1lC86GgaZqJVSDWqw6mjT5hzjg+i8=' 'sha256-GOcjvQ8AeHKWQCrgFCqG7/EYfPFEbpxYwLX+dFD/3qk=' 'sha256-g61Gx8qh6EeJqNFNPKOopcDVv4mbn7GAWLBVueYCSwA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self' https://pay.mzfpay.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /404.html {
    internal;
  }

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-h2zt+LUCrVck7i1lC86GgaZqJVSDWqw6mjT5hzjg+i8=' 'sha256-GOcjvQ8AeHKWQCrgFCqG7/EYfPFEbpxYwLX+dFD/3qk=' 'sha256-g61Gx8qh6EeJqNFNPKOopcDVv4mbn7GAWLBVueYCSwA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self' https://pay.mzfpay.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/(?:login|terms|privacy|error|invite/[^/]+|app(?:/interviews/new|/interviews/[^/]+/(?:prepare|live|review)|/library|/billing|/guide|/devices|/settings)?)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-h2zt+LUCrVck7i1lC86GgaZqJVSDWqw6mjT5hzjg+i8=' 'sha256-GOcjvQ8AeHKWQCrgFCqG7/EYfPFEbpxYwLX+dFD/3qk=' 'sha256-g61Gx8qh6EeJqNFNPKOopcDVv4mbn7GAWLBVueYCSwA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self' https://pay.mzfpay.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    return 404;
  }
}
