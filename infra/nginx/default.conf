server {
  listen 80;
  server_name _;

  if ($host = www.mianshiwen.cn) {
    return 308 https://mianshiwen.cn$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  set $offersteady_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-h2zt+LUCrVck7i1lC86GgaZqJVSDWqw6mjT5hzjg+i8=' 'sha256-CEy0yC/pHlXfLhNBOaA/UGMovhIUWL0ourEGerAgRu4=' 'sha256-zeVA7adHEjFgFdodyWgCoNTJ5iEmcyNCxpuOvot6xDQ=' 'sha256-Qznqq2GUGvk3wgbTH0sXVeVpeHhvenQuYOQddbtu5sg=' 'sha256-45wxGO3n/cPQcq0fers1m+axm/KYbdaWsvpY6oG8Ejc=' 'sha256-EuqMMd+5Ee1p6RngvvVBcFu7nUbWbxqymLGiMKZRE4k=' 'sha256-wGbS3hzFWe3AyrhKHQdIcablkO1pUiBs8XoKKmdpA9c=' 'sha256-kAA1jLkwuU7JgTtzszlb56pew+UC1AJJrwn94Ocby9I=' 'sha256-6FAgDEF9rjpPtkglSKYPEcbxBT2f2szM30KWS9ge/s0=' 'sha256-VYmb2j4M2GAdQdQuXOVJfoMildBUsIZBvM5OuDPsALw=' 'sha256-9hQ1yMLbvZb7zELw3wQN+5F2ag00udhsZkez/cQezGg=' 'sha256-vIsUdY/u1VQ8dg+g+v0StTKN2cMDOHpkqvG7C1ePf94=' 'sha256-KmyKJnViu6kxS1lTdI9w79T5RSwDVW8lqhutWmvhk24=' 'sha256-rQgc1y1hXo0KamWoayyTVlJ1kzANqDrois16AR/mEZk=' 'sha256-OjjKsIkwZcR8PCLmtq4uy58NyKtrnddSmm6TfjnC+iI=' 'sha256-8zozZaVC4VHr0iWH6sO54dZQentaAz8MZCJfviKMTbY=' 'sha256-vt0Wqw36UrEOJTbDnRoAZpSL5VVMk1rnkqFskkBWnmQ=' 'sha256-5l5Qx8e5PZO3Z7Y3inO5INEHTknJdRWKhZjKBTvc75k=' 'sha256-Db1tlMY9Ci4YLqiCWg7ezBhoY568QU/KL8TQwns3EgQ=' 'sha256-nlSWvxmiLARHjmEGByrt9b66w5gh3nkRBIPaf80m75Q=' 'sha256-Ysezpm4XtH2g/37ZUhGs45LwdlaVgz/eil4buhKLib4=' 'sha256-d2pWKFQM5WW10qUj2iMzaOlcYu5raT/gwfn658Fj6rk=' 'sha256-cNoPClAalygNSk2IcRkKGy0RD4TBfRWWFeZFAnqIujg=' 'sha256-xZ8pFwKTRYZWQfU8dS3RQ3NqKrtwmm0EokQQwObhDyM=' 'sha256-x88Et6X/lFXIPTowjRTLhdsmOiGhIQVt2pd9npI0J4Q=' 'sha256-wkAEv55iPQSr7l8N1k20d0eqh99l577VB70LycRAQ7Y=' 'sha256-CGxXmGqMMdBm/SLXHjKc7Bxo482zMXgkZQrBvEUV4jQ=' 'sha256-afA5XIb5RF8SYWr2N2LcD5/7u3S6PUzRj8y+zAhrJkk=' 'sha256-esbkUK0hQXBgFIQcL0H/KHfsEagYvEX9Q7dIBqBnSPU=' 'sha256-YRQk+uyJPU5rIOvHqD0zaB2heUd0Fp8Pykv2JVjQY9g=' 'sha256-Rw8XIRZmkkjruWJHVwsrTbOBL2Zo6bIMLznGBzBPB2Y=' 'sha256-f5ZC/h8tSxBkN/lgcsTc961tcrf+PnTgPMkmzZKFoe0=' 'sha256-vtDGl+XgcvTV9w+6zET3hlSJcoasabSndJmMmQvVfVw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self' https://pay.mzfpay.com";

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $offersteady_csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    proxy_pass http://backend:8000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /robots.txt {
    types { text/plain txt; }
    try_files $uri =404;
  }

  location = /sitemap.xml {
    types { application/xml xml; }
    try_files $uri =404;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /llms-full.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /public-facts.json {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /offersteady-build.json {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /seo/public-search.css {
    default_type text/css;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /404.html {
    internal;
  }

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/guide/?$ {
    try_files /guide.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/(features|guides|interview-questions)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/features/(ai-interview-assistant|realtime-interview|screenshot-answer|interview-review)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/(pricing|download|security|about|contact)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/guides/(audio-troubleshooting|interview-preparation|macos-permissions|feishu-audio-setup|tencent-meeting-audio-setup|star-interview-answer|self-introduction|project-experience|technical-interview|common-interview-questions)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/interview-questions/(llm|rag|ai-agent)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/interview-questions/(java-backend|frontend|algorithms)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/(?:login|terms|privacy|error|invite/[^/]+|app(?:/interviews/new|/interviews/[^/]+/(?:prepare|live|review)|/library|/billing|/guide|/devices|/settings)?)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    return 404;
  }
}
