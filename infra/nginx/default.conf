server {
  listen 80;
  server_name _;

  if ($host = www.mianshiwen.cn) {
    return 308 https://mianshiwen.cn$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  set $offersteady_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-h2zt+LUCrVck7i1lC86GgaZqJVSDWqw6mjT5hzjg+i8=' 'sha256-CEy0yC/pHlXfLhNBOaA/UGMovhIUWL0ourEGerAgRu4=' 'sha256-zeVA7adHEjFgFdodyWgCoNTJ5iEmcyNCxpuOvot6xDQ=' 'sha256-Qznqq2GUGvk3wgbTH0sXVeVpeHhvenQuYOQddbtu5sg=' 'sha256-45wxGO3n/cPQcq0fers1m+axm/KYbdaWsvpY6oG8Ejc=' 'sha256-wGbS3hzFWe3AyrhKHQdIcablkO1pUiBs8XoKKmdpA9c=' 'sha256-Uz25W+Rr1IWZH0siwuDq+GGHCAELcV+KY0O+I6+sIfc=' 'sha256-c60nUixLEuRe81oxahsfLaGrUNai5488zj2LOtisWoA=' 'sha256-KmyKJnViu6kxS1lTdI9w79T5RSwDVW8lqhutWmvhk24=' 'sha256-8zozZaVC4VHr0iWH6sO54dZQentaAz8MZCJfviKMTbY=' 'sha256-vt0Wqw36UrEOJTbDnRoAZpSL5VVMk1rnkqFskkBWnmQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self' https://pay.mzfpay.com";

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $offersteady_csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    proxy_pass http://backend:8000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /robots.txt {
    types { text/plain txt; }
    try_files $uri =404;
  }

  location = /sitemap.xml {
    types { application/xml xml; }
    try_files $uri =404;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /llms-full.txt {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /public-facts.json {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /seo/public-search.css {
    default_type text/css;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /404.html {
    internal;
  }

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/guide/?$ {
    try_files /guide.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/features/(ai-interview-assistant|realtime-interview|screenshot-answer|interview-review)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/guides/(audio-troubleshooting|interview-preparation)/?$ {
    try_files /seo/$1.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/(?:login|terms|privacy|error|invite/[^/]+|app(?:/interviews/new|/interviews/[^/]+/(?:prepare|live|review)|/library|/billing|/guide|/devices|/settings)?)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $offersteady_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    return 404;
  }
}
