server {
  listen 80;
  listen [::]:80;
  server_name offersteady.com;
  return 301 https://offersteady.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.offersteady.com;
  return 301 https://offersteady.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.offersteady.com;

  ssl_certificate /etc/letsencrypt/live/offersteady.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/offersteady.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://offersteady.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name offersteady.com;

  ssl_certificate /etc/letsencrypt/live/offersteady.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/offersteady.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # The public edge must allow the same scoped material proxy payloads as the
  # inner Web gateway; unrelated public API routes keep Nginx's default limit.
  location ~ ^/api/v1/(?:resume|job-descriptions|knowledge/collections/[^/]+)/uploads/proxy$ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:18880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:18880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
