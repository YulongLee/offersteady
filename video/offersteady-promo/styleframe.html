<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>面试稳宣传片 Styleframe</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#05080d;color:#edf2f8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sheet{width:1920px;padding:90px;display:grid;gap:72px}.frame{position:relative;width:1740px;height:978px;overflow:hidden;border:1px solid rgba(152,169,190,.16);border-radius:28px;background:radial-gradient(circle at 72% 10%,rgba(43,157,127,.16),transparent 43%),#080c13;box-shadow:0 40px 120px rgba(0,0,0,.45)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(130,180,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(130,180,255,.025) 1px,transparent 1px);background-size:72px 72px}.k{font:700 20px SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#6ee7bd}.hero{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.hero h1{margin:24px 0 20px;font-size:142px;letter-spacing:-.065em}.hero p{font-size:42px;color:#8f9db0}.workspace{position:absolute;left:110px;right:110px;top:110px;bottom:110px;display:grid;grid-template-columns:.78fr 1.22fr;gap:18px;transform:perspective(1600px) rotateX(2deg)}.panel{border:1px solid rgba(152,169,190,.16);border-radius:22px;background:rgba(16,23,33,.92);box-shadow:0 30px 90px rgba(0,0,0,.34);padding:34px}.panel h2{margin:0 0 28px;font-size:34px}.line{height:20px;border-radius:10px;background:#263241;margin:20px 0}.line.g{background:#6ee7bd;width:66%}.answer{font-size:36px;line-height:1.6}.pill{display:inline-block;margin:18px 10px 0 0;padding:12px 18px;border:1px solid rgba(110,231,189,.25);border-radius:999px;color:#bdebdc;background:rgba(110,231,189,.08);font-size:22px}.group{position:absolute;inset:0;display:grid;place-items:center}.group h2{z-index:3;margin:0;font-size:118px;letter-spacing:-.055em;text-shadow:0 15px 50px #000}.card{position:absolute;width:430px;height:240px;border:1px solid rgba(152,169,190,.2);border-radius:22px;background:#101721;box-shadow:0 28px 80px rgba(0,0,0,.5)}.c1{transform:translate(-560px,-250px) rotate(-4deg)}.c2{transform:translate(550px,-230px) rotate(4deg)}.c3{transform:translate(-520px,290px) rotate(3deg)}.c4{transform:translate(540px,280px) rotate(-3deg)}.halo{position:absolute;width:900px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(110,231,189,.23),transparent 68%);filter:blur(20px)}
</style>
<body><main class="sheet">
  <section class="frame"><div class="grid"></div><div class="hero"><span class="k">AI INTERVIEW COPILOT</span><h1>面试稳AI助手</h1><p>从听懂问题，到组织答案，现场更从容。</p></div></section>
  <section class="frame"><div class="grid"></div><div class="workspace"><div class="panel"><span class="k">实时对话</span><h2>请介绍一个最有挑战的项目</h2><div class="line"></div><div class="line" style="width:82%"></div><div class="line g"></div></div><div class="panel"><span class="k">回答建议</span><h2 class="answer">先说明项目目标，再聚焦你的技术决策，最后用可核对的结果收尾。</h2><span class="pill">简历</span><span class="pill">目标岗位 JD</span><span class="pill">系统设计知识库</span></div></div></section>
  <section class="frame"><div class="grid"></div><div class="group"><div class="halo"></div><div class="card c1"></div><div class="card c2"></div><div class="card c3"></div><div class="card c4"></div><h2>从容冲刺 Offer</h2></div></section>
</main></body></html>
