appId: com.offersteady.companion.beta
productName: 面试稳伴随程序 Beta
directories:
  output: release/macos-beta
  buildResources: build
files:
  - dist/**/*
  - "!dist/native/**/*"
asar: true
mac:
  identity: "Yulong li (8Y5FAR3TF3)"
  type: distribution
  forceCodeSigning: true
  hardenedRuntime: true
  strictVerify: true
  notarize: true
  icon: resources/app-icon.png
  category: public.app-category.productivity
  minimumSystemVersion: 14.2.0
  entitlements: build/entitlements.mac.release.plist
  entitlementsInherit: build/entitlements.mac.release.inherit.plist
  # Electron resource payloads are sealed by the enclosing bundles. Treating
  # them as Mach-O binaries causes thousands of duplicate timestamp requests
  # through framework symlinks and makes an official build nondeterministic.
  signIgnore: '/(?:Resources|resources)/.*\.(?:asar|bin|dat|pak)$'
  binaries:
    - Contents/Resources/app/native/macos-capture/OfferSteadyCaptureRuntime
  extendInfo:
    NSMicrophoneUsageDescription: 面试稳 Beta 仅在你明确开始后使用麦克风识别你的表达。
    NSAudioCaptureUsageDescription: 面试稳 Beta 仅在你明确开始后采集系统音频以识别面试问题。
    NSScreenCaptureUsageDescription: 面试稳 Beta 仅在你明确授权后使用屏幕权限进行屏幕预览和截屏回答，不保存屏幕录像。
  target:
    - target: dmg
  extraResources:
    - from: dist/native/macos-capture/OfferSteadyCaptureRuntime
      to: app/native/macos-capture/OfferSteadyCaptureRuntime
  artifactName: OfferSteady-Companion-Beta-${version}-macOS-${arch}.${ext}
dmg:
  sign: false
  title: 面试稳伴随程序 Beta ${version}
