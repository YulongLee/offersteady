<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>页面不存在 - 面试稳</title>
    <style>
      :root { color-scheme: dark; font-family: sans-serif; background: #091019; color: #eef4f8; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(560px, calc(100% - 40px)); text-align: center; }
      p { color: #9eabba; line-height: 1.7; }
      a { display: inline-block; margin-top: 18px; border-radius: 12px; padding: 12px 20px; background: #6ee7bd; color: #07120f; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>没有找到这个页面</h1>
      <p>地址可能已经失效，或页面从未存在。你可以返回面试稳首页继续使用。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
